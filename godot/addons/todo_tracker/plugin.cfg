[plugin]

name="Todo Tracker"
description="Scans every script in your project for TODO, FIXME, HACK, BUG and NOTE comments, plus any custom tag and regex your team defines, and lists them in a dock. Click a result to jump straight to that line. Auto-refreshes when files change, and can export the list as a Markdown checklist."
author="Kurtis Klay"
version="1.1.0"
script="plugin.gd"
