[project]
godot = "4.7.2-stable"

[sync]
force_overwrite = ["**/*.import", "**/*.uid"]

[[dependency]]
name = "gdunit4"
git = "https://github.com/godot-gdunit-labs/gdUnit4.git"
rev = "v6.2.2"
exclude = ["addons/gdUnit4/test"]

[[dependency.map]]
from = "addons/gdUnit4"

[[dependency]]
name = "phantom-camera"
git = "https://github.com/ramokz/phantom-camera.git"
rev = "v0.11.0.3"

[[dependency.map]]
from = "addons/phantom_camera"

[[dependency]]
name = "limbo-console"
url = "https://github.com/limbonaut/limbo_console/releases/download/v0.8.0/limbo_console_v0.8.0.zip"
sha256 = "68cee989910322561222fde3261871a7bd0878122147a949bbb7a27fabef8d9a"

[[dependency]]
name = "guide"
git = "https://github.com/godotneers/G.U.I.D.E.git"
rev = "v0.15.0"

[[dependency.map]]
from = "addons/guide"

[[dependency]]
name = "limboai"
url = "https://github.com/limbonaut/limboai/releases/download/v1.8.1/limboai%2Bv1.8.1.gdextension-4.6.zip"
sha256 = "0910411f8dbc0da8920f6c8bbbb6397c347cd9f2f193942468a702dfb11d5f0e"

[[dependency.map]]
from = "addons/limboai"

[[dependency]]
name = "yard"
git = "https://github.com/elliotfontaine/yard-godot.git"
rev = "v1.3.1"

[[dependency.map]]
from = "addons/yard"

[[dependency]]
name = "better-tooltips"
# Git source, not the Asset Store: ggg 0.5.0 reuses the locked store URL, which expires after 10 minutes.
git = "https://github.com/Tobias004/filesystem_dock_tooltips.git"
rev = "10de44d45107a8348190a534bc22f8e69356b4b4" # v3.0.0
map = [{ from = "addons/better_tooltips" }]

[[dependency]]
name = "cyclops-level-builder"
url = "https://github.com/blackears/cyclopsLevelBuilder/releases/download/v1.5.1/cyclops_level_builder_1.5.1_for_Godot_4.7.zip"
# Upstream (blackears) re-uploaded the v1.5.1 asset on 2026-10-17. Diffed against the original
# (sha256 f9220923...a2a5): the only changes are upstream commit 07675aa (three queue_free lines
# in cyclops_level_builder.gd, the editor-exit fix) and plugin.cfg version "1.5.1_dev".
sha256 = "46d6586b2c4843202318794aefca8e7f4be31bde5b52da3424c9313f21691c11"
map = [{ from = "addons/cyclops_level_builder" }]
