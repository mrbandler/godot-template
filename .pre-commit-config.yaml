# Hooks run by prek (https://prek.j178.dev) locally and in CI.
# All hooks are native: no Python or Node needed.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
# Tool-generated lockfiles and third-party code (addons, submodules) are never touched.
exclude: ^(devenv\.lock|godot/ggg\.lock|cpp/(godot-cpp|vcpkg)/.*|godot/addons/.*)$

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: require-pattern
        name: conventional commit message
        stages: [commit-msg]
        args:
          - '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([\w./-]+\))?!?: \S'
          - '^(fixup|squash|amend)! '
          - '^(Merge|Revert) '

  - repo: local
    hooks:
      - id: typos
        name: typos
        entry: typos --force-exclude
        language: system
        types: [text]
      - id: zizmor
        name: zizmor
        entry: zizmor
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      # Formatters run in fix mode: a changed file fails the hook, you review and `git add` again.
      - id: gdscript-format
        name: gdscript-formatter
        entry: gdscript-formatter
        language: system
        files: \.gd$
      - id: gdscript-lint
        name: gdscript-formatter lint
        entry: gdscript-formatter lint
        language: system
        files: \.gd$
      - id: project-layout
        name: project layout
        entry: python3 tools/check_layout.py
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path rust/Cargo.toml --all
        language: system
        files: ^rust/.*\.rs$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
        language: system
        files: ^rust/
        pass_filenames: false
      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        files: ^cpp/extensions/.*\.(cpp|hpp|h)$
      - id: clang-tidy
        name: clang-tidy
        # Configure first so compile_commands.json exists (fast after the first run).
        # Bare clang-tidy lacks the wrapped compiler's system include paths, so pass them on.
        entry: >-
          bash -c 'cmake --preset debug -S cpp >/dev/null &&
          sys=$(c++ -E -x c++ -v /dev/null 2>&1 | sed -n "/^#include <...>/,/^End of/p" | grep "^ /" | grep -v framework | sed "s/^ /--extra-arg=-isystem/") &&
          clang-tidy -p cpp/build/debug --quiet $sys "$@"' --
        language: system
        files: ^cpp/extensions/.*\.cpp$
      - id: cargo-shear
        name: cargo shear
        entry: bash -c 'cd rust && cargo shear'
        language: system
        files: ^rust/(Cargo\.toml|.*\.rs)$
        pass_filenames: false
        stages: [pre-push]
      - id: just-test
        name: just test
        entry: just test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
