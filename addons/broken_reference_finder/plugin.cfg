[plugin]

name="Broken Reference Finder"
description="Scans every .tscn, .tres, .gd and .cs file for res:// and uid:// references that point to files which no longer exist, so a moved or deleted asset stops causing a silent load error or a red [empty] slot. Checks each reference's uid against Godot's own UID table first, so a path that only looks stale because a uid already repairs it on load is not reported as a false positive. Shows exactly which file and line each real broken reference lives on, and exports the list as Markdown."
author="Kurtis Klay"
version="1.1.0"
script="plugin.gd"
